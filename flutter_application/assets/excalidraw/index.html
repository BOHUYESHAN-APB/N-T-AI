<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excalidraw</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #app { width: 100%; height: 100%; }
    </style>
    <script>
        window.EXCALIDRAW_ASSET_PATH = "./";
    </script>
</head>
<body>
    <div id="app"></div>
    <script src="excalidraw.bundle.js"></script>
    <script>
        const App = () => {
            const [excalidrawAPI, setExcalidrawAPI] = React.useState(null);

            React.useEffect(() => {
                if (excalidrawAPI) {
                    window.excalidrawAPI = excalidrawAPI;
                    // Notify Flutter that we are ready
                    // We can use a specific channel name or just console.log if we intercept it
                    console.log('Excalidraw Ready');
                }
            }, [excalidrawAPI]);

            return React.createElement(
                React.Fragment,
                null,
                React.createElement(
                    'div',
                    { style: { height: '100vh' } },
                    React.createElement(ExcalidrawLib.Excalidraw, {
                        excalidrawAPI: (api) => setExcalidrawAPI(api),
                        theme: 'light',
                        UIOptions: {
                            canvasActions: {
                                loadScene: false,
                                export: false,
                                saveAsImage: false
                            }
                        }
                    })
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
