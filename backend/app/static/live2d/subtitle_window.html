<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户字幕窗口</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    #subtitle-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 18px 22px;
      box-sizing: border-box;
    }

    #subtitle-card {
      max-width: min(900px, 94vw);
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.55);
      color: #f8fafc;
      font-size: 20px;
      line-height: 1.4;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(6px);
      transition: opacity 0.2s ease;
      opacity: 0;
    }

    #subtitle-card.show {
      opacity: 1;
    }

    #subtitle-label {
      position: absolute;
      top: 10px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.4);
      color: #f8fafc;
    }

    .kind-mic #subtitle-card {
      border-left: 4px solid #38bdf8;
    }

    .kind-voice #subtitle-card {
      border-left: 4px solid #34d399;
    }
  </style>
</head>
<body>
  <div id="subtitle-wrap">
    <div id="subtitle-label">用户 / 语音</div>
    <div id="subtitle-card"></div>
  </div>

  <script>
    const subtitleWrap = document.getElementById('subtitle-wrap');
    const subtitleCard = document.getElementById('subtitle-card');
    const subtitleLabel = document.getElementById('subtitle-label');
    subtitleWrap.classList.add('kind-mic');

    let currentText = '';
    function normalizeText(text) {
      if (!text) return '';
      let cleaned = String(text);
      cleaned = cleaned.replace(/\[SPLIT\]/g, ' ');
      cleaned = cleaned.replace(/\[END_OF_SPEECH\]/g, ' ');
      cleaned = cleaned.replace(/```[\s\S]*?```/g, ' ');
      cleaned = cleaned.replace(/`([^`]*)`/g, '$1');
      cleaned = cleaned.replace(/[>*#_`]/g, ' ');
      cleaned = cleaned.replace(/\s+/g, ' ').trim();
      return cleaned;
    }

    function showText(text) {
      const normalized = normalizeText(text);
      if (!normalized) return;
      subtitleCard.textContent = normalized;
      subtitleCard.classList.add('show');
    }
    function updateUserSubtitle(text, kind, prefix) {
      const normalized = normalizeText(text);
      if (!normalized) return;
      currentText = prefix ? `[${prefix}] ${normalized}` : normalized;
      subtitleWrap.classList.toggle('kind-voice', kind === 'voice');
      subtitleWrap.classList.toggle('kind-mic', kind !== 'voice');
      showText(currentText);
    }

    function handleMessage(message) {
      if (!message || typeof message !== 'object') return;
      if (message.type === 'user_transcript') {
        updateUserSubtitle(message.text || '', 'mic', '麦克风');
        return;
      }

      if (message.type === 'voice_channel_transcript') {
        const channelId = (message.channel_id || '').toString();
        const speaker = (message.speaker || '').toString();
        const prefixParts = ['语音频道'];
        if (channelId) prefixParts.push(channelId);
        if (speaker) prefixParts.push(speaker);
        updateUserSubtitle(message.text || '', 'voice', prefixParts.join(' '));
      }
    }

    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const wsUrl = `${protocol}://${window.location.host}/api/live2d/ws`;
      const socket = new WebSocket(wsUrl);

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleMessage(data);
        } catch (_) {}
      };

      socket.onclose = () => {
        setTimeout(connect, 3000);
      };

      socket.onerror = () => {
        socket.close();
      };
    }

    connect();
  </script>
</body>
</html>
